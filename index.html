<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IRAQ MIND MAP 3D — ULTIMATE EDITION</title>
<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
:root{--bg:#02040a;--panel:rgba(8,14,32,0.92);--line:#4a2dff;--accent:#00f5ff;--hotpink:#ff006e;--lime:#06ffa5;--gold:#ffe600;--purple:#b537f2;--ok:#00ffa3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:#f0fbff;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
#map{position:absolute;inset:0}
#loading{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#150036,#020410 65%);text-align:center;padding:24px;transition:opacity .5s}
#loading h1{margin:0 0 6px;font-size:28px;letter-spacing:4px;background:linear-gradient(90deg,#00f5ff,#ff006e,#ffe600,#06ffa5);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;filter:drop-shadow(0 0 20px #ff006e99)}
#loading .sub{font-size:13px;color:#b8d9ff;margin-bottom:22px}
#loading .ring{width:70px;height:70px;border-radius:50%;border:3px solid transparent;border-top-color:#00f5ff;border-right-color:#ff006e;border-bottom-color:#ffe600;animation:spin 1.2s linear infinite;margin-bottom:22px;box-shadow:0 0 30px #00f5ff66}
@keyframes spin{to{transform:rotate(360deg)}}
#bar{width:min(340px,80vw);height:6px;border-radius:6px;background:#10082a;overflow:hidden;margin-top:6px;border:1px solid #4a2dff55}
#bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#00f5ff,#ff006e,#ffe600,#06ffa5);background-size:300% 100%;animation:shimmer 2s linear infinite;transition:width .4s ease;box-shadow:0 0 20px #00f5ffaa}
@keyframes shimmer{to{background-position:300% 0}}
#loadText{font-size:13px;color:#b8d9ff;margin:14px 0 0;line-height:1.9;max-width:420px}
.retryBtn{margin-top:16px;padding:11px 24px;background:linear-gradient(135deg,#ff006e,#b537f2);color:#fff;font-weight:700;border:0;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;transition:.18s;box-shadow:0 4px 20px #ff006e77}
#header{position:absolute;top:12px;left:12px;right:12px;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.logo,.status{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:11px;line-height:1.7;backdrop-filter:blur(16px);pointer-events:auto;box-shadow:0 8px 40px #4a2dff55,0 0 0 1px #4a2dff33 inset}
.logo strong{font-size:15px;letter-spacing:2px;font-weight:800;background:linear-gradient(90deg,#00f5ff,#ff006e,#ffe600);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{color:#8fb8e8;font-size:10px}
.status{display:flex;align-items:center;gap:8px;font-size:11px;color:#d9ecff;white-space:nowrap}
.status b{color:var(--lime);font-weight:700;text-shadow:0 0 12px var(--lime)}
.dotlive{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime),0 0 24px var(--lime);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.2;transform:scale(.8)}}
button{font-family:inherit}
.tool{padding:11px 15px;color:#fff;font-size:12px;cursor:pointer;font-weight:600;background:linear-gradient(135deg,rgba(20,10,50,.92),rgba(10,30,60,.92));border:1px solid #4a2dff;border-radius:11px;backdrop-filter:blur(12px);transition:.18s;white-space:nowrap;box-shadow:0 4px 20px #4a2dff44;flex-shrink:0}
.tool:hover{background:linear-gradient(135deg,#4a2dff,#b537f2);border-color:#00f5ff;color:#fff;transform:translateY(-1px);box-shadow:0 6px 30px #b537f288}
.tool.on{background:linear-gradient(135deg,#00f5ff,#06ffa5);border-color:#00f5ff;color:#021018;font-weight:800;box-shadow:0 0 24px #00f5ff88}
#myLocation.on{background:linear-gradient(135deg,#ffe600,#ff006e);border-color:#ffe600;color:#021018;box-shadow:0 0 24px #ffe60088;animation:pulseBtn 2s infinite}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 24px #ffe60088}50%{box-shadow:0 0 40px #ffe600cc}}
#panel{position:absolute;z-index:25;right:12px;top:74px;bottom:12px;width:min(350px,86vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;overflow-y:auto;display:none;box-shadow:0 20px 70px #000c,0 0 0 1px #4a2dff44 inset;backdrop-filter:blur(18px);animation:slideIn .35s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
#panel::-webkit-scrollbar{width:7px}
#panel::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00f5ff,#ff006e);border-radius:4px}
#panel h2{margin:0 0 4px;font-size:21px;font-weight:800;background:linear-gradient(90deg,#00f5ff,#ffe600,#ff006e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #00f5ff77)}
#panel .enName{font-size:11px;color:#8fb8e8;margin:0 0 14px;letter-spacing:1px;font-weight:600}
#panel h3{font-size:12px;margin:20px 0 10px;letter-spacing:.6px;font-weight:700;color:#ffe600;padding-bottom:7px;border-bottom:1px solid #4a2dff66;text-shadow:0 0 12px #ffe60066}
#panel p{font-size:12.5px;line-height:1.9;color:#d9ecff;margin:0 0 8px}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.stat{background:linear-gradient(135deg,rgba(74,45,255,.15),rgba(181,55,242,.15));border:1px solid #4a2dff77;border-radius:12px;padding:10px 11px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;right:0;width:3px;height:100%;background:linear-gradient(180deg,#00f5ff,#ff006e);box-shadow:0 0 12px #00f5ff}
.stat span{display:block;font-size:10px;color:#a8b8e8;margin-bottom:4px;font-weight:600}
.stat b{font-size:15px;color:#fff;font-weight:800;letter-spacing:.3px}
.stat b em{font-size:10px;color:#a8b8e8;font-style:normal;font-weight:600}
#storyBox{margin-top:16px;padding:14px;background:linear-gradient(135deg,rgba(255,230,0,.08),rgba(255,0,110,.08));border:1px solid #FFE60066;border-radius:12px;font-size:12.5px;line-height:1.9;color:#FFE600;display:none}
#branches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#branches button{width:100%;padding:11px 8px;font-size:11.5px;font-weight:600;border:1px solid #4a2dff88;border-radius:11px;background:linear-gradient(135deg,rgba(74,45,255,.2),rgba(181,55,242,.15));color:#e8f4ff;cursor:pointer;transition:.16s;text-align:center}
#branches button:hover{background:linear-gradient(135deg,#4a2dff,#b537f2);border-color:#00f5ff;color:#fff;box-shadow:0 0 20px #b537f288;transform:translateY(-1px)}
#branches button.active{background:linear-gradient(135deg,#ffe600,#ff006e);border-color:#ffe600;color:#021018;font-weight:800;box-shadow:0 0 24px #ffe60088}
.panelActions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.panelActions button{flex:1;min-width:110px;padding:12px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:700;border:1px solid #4a2dff;background:linear-gradient(135deg,#1a1060,#2a1580);color:#fff;transition:.16s;box-shadow:0 4px 16px #4a2dff44}
.panelActions button:hover{background:linear-gradient(135deg,#4a2dff,#b537f2);border-color:#00f5ff;box-shadow:0 0 24px #b537f288;transform:translateY(-1px)}
.panelActions button.danger{border-color:#ff006e;background:linear-gradient(135deg,#5a0030,#8a0040);color:#ffb0d0}
.panelActions button.danger:hover{background:linear-gradient(135deg,#ff006e,#b537f2);color:#fff;box-shadow:0 0 24px #ff006e88}
#close{position:absolute;left:12px;top:12px;width:32px;height:32px;background:linear-gradient(135deg,#4a2dff,#b537f2);color:#fff;border:0;border-radius:10px;cursor:pointer;font-size:15px;font-weight:800;transition:.16s;box-shadow:0 4px 16px #4a2dff66}
#close:hover{background:linear-gradient(135deg,#ff006e,#b537f2);transform:rotate(90deg);box-shadow:0 0 24px #ff006e88}
#sideList{position:absolute;z-index:22;left:12px;top:74px;bottom:12px;width:min(260px,80vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px;display:flex;flex-direction:column;box-shadow:0 20px 70px #000c,0 0 0 1px #4a2dff44 inset;backdrop-filter:blur(18px);transition:transform .3s ease,opacity .3s ease}
#sideList.hidden{transform:translateX(-115%);opacity:0;pointer-events:none}
#sideList h4{margin:2px 0 11px;font-size:12px;font-weight:700;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center;color:#ffe600;text-shadow:0 0 10px #ffe60077}
#search{width:100%;padding:10px 12px;margin-bottom:10px;background:rgba(20,10,50,.8);border:1px solid #4a2dff88;border-radius:11px;color:#fff;font-size:12px;font-family:inherit;outline:none;transition:.16s}
#search:focus{border-color:#00f5ff;box-shadow:0 0 0 3px #00f5ff33,0 0 20px #00f5ff66}
#search::placeholder{color:#7a8fc0}
#provList{overflow-y:auto;flex:1;padding-left:2px}
#provList::-webkit-scrollbar{width:6px}
#provList::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00f5ff,#b537f2);border-radius:4px}
.provItem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;cursor:pointer;font-size:12.5px;color:#d9ecff;transition:.15s;border:1px solid transparent;font-weight:500}
.provItem:hover{background:linear-gradient(90deg,rgba(74,45,255,.25),rgba(181,55,242,.15));border-color:#4a2dff}
.provItem.active{background:linear-gradient(90deg,rgba(0,245,255,.3),rgba(255,0,110,.2));border-color:#00f5ff;color:#fff;font-weight:700;box-shadow:0 0 16px #00f5ff55}
.provItem .swatch{width:12px;height:12px;border-radius:4px;flex-shrink:0;box-shadow:0 0 12px currentColor,0 0 6px currentColor inset}
.provItem .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tools{position:absolute;bottom:15px;left:12px;z-index:23;display:flex;flex-wrap:wrap;gap:8px;max-width:min(700px,68vw)}
.node{width:0;height:0;cursor:pointer;z-index:2}
.node .dot{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffffff,#00f5ff 45%,#ff006e);border:2px solid #fff;box-shadow:0 0 12px #00f5ff,0 0 26px #ff006e,0 0 40px #00f5ff88;animation:pulse 2.4s infinite;transition:.2s}
.node:hover .dot{transform:scale(1.5);background:radial-gradient(circle at 35% 35%,#fff,#ffe600 45%,#ff006e);box-shadow:0 0 20px #ffe600,0 0 40px #ff006e}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #00f5ff99,0 0 12px #00f5ff,0 0 26px #ff006e}55%{box-shadow:0 0 0 12px #00f5ff00,0 0 24px #00f5ff,0 0 40px #ff006e}}
.node-label{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);background:rgba(10,4,30,.94);border:1px solid #4a2dff;border-radius:9px;padding:4px 10px;color:#fff;white-space:nowrap;font-size:11px;font-weight:600;pointer-events:none;box-shadow:0 4px 16px #4a2dff88,0 0 16px #00f5ff44;transition:.18s}
.node:hover .node-label{background:linear-gradient(90deg,#ff006e,#b537f2);border-color:#ffe600;color:#fff;box-shadow:0 0 20px #ffe600aa}
.user-marker{width:0;height:0;z-index:10}
.user-dot{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffffff,#00f5ff 60%);border:2px solid #fff;box-shadow:0 0 20px #00f5ff,0 0 40px #00f5ff}
.user-pulse{position:absolute;left:-25px;top:-25px;width:50px;height:50px;border-radius:50%;background:rgba(0,245,255,0.2);border:2px solid #00f5ff;animation:userPulse 2s infinite ease-out}
@keyframes userPulse{0%{transform:scale(0.3);opacity:1}100%{transform:scale(2.5);opacity:0}}
#toast{position:absolute;z-index:70;bottom:80px;right:50%;transform:translateX(50%) translateY(20px);background:linear-gradient(135deg,rgba(74,45,255,.95),rgba(181,55,242,.9));border:1px solid #00f5ff;border-radius:13px;padding:12px 20px;font-size:13px;color:#fff;font-weight:600;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 10px 44px #4a2dff88,0 0 24px #00f5ff88;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(50%) translateY(0)}
@media(max-width:720px){#sideList{width:min(250px,74vw);top:120px}#panel{width:min(330px,92vw);top:120px}#tools{max-width:calc(100vw - 24px);bottom:78px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}#tools::-webkit-scrollbar{height:4px}#tools::-webkit-scrollbar-thumb{background:#4a2dff;border-radius:2px}.tool{padding:9px 12px;font-size:11px}#header{top:8px;left:8px;right:8px}.logo{padding:8px 11px}.logo strong{font-size:12px}.status{font-size:10px;padding:8px 11px}}
</style>
</head>

<body>

<div id="map"></div>

<div id="loading">

function applyVividTheme(){
  if(!map)return;
  const style=map.getStyle();
  if(!style||!style.layers)return;
  style.layers.forEach(layer=>{
    const id=layer.id;
    const srcLayer=layer['source-layer']||'';
    const type=layer.type;
    try{
      if(layer.source&&!map.getSource(layer.source))return;
      if(type==='background'){map.setPaintProperty(id,'background-color','#0a0320');return}
      if(!srcLayer)return;
      if(srcLayer==='water'){if(type==='fill'){map.setPaintProperty(id,'fill-color','#00d9ff');map.setPaintProperty(id,'fill-opacity',0.9)}else if(type==='line'){map.setPaintProperty(id,'line-color','#00d9ff')}return}
      if(srcLayer==='building'&&type==='fill'){map.setPaintProperty(id,'fill-color','#ff006e');map.setPaintProperty(id,'fill-opacity',0.85);return}
      if((srcLayer==='landcover'||srcLayer==='landuse'||srcLayer==='park')&&type==='fill'){map.setPaintProperty(id,'fill-color','#06ffa5');map.setPaintProperty(id,'fill-opacity',0.5);return}
      if(srcLayer==='transportation'){let color='#b537f2';if(/motorway/i.test(id))color='#ff006e';else if(/trunk/i.test(id))color='#fb5607';else if(/primary/i.test(id))color='#ffe600';else if(/secondary/i.test(id))color='#00f5ff';if(type==='line'){map.setPaintProperty(id,'line-color',color);map.setPaintProperty(id,'line-opacity',0.92)}return}
      if(srcLayer==='boundary'&&type==='line'){map.setPaintProperty(id,'line-color','#ffe600');return}
      if(srcLayer==='place'&&type==='symbol'){try{map.setPaintProperty(id,'text-color','#ffffff')}catch(e){};try{map.setPaintProperty(id,'text-halo-color','#0a0320')}catch(e){}}
    }catch(err){}
  });
}

const OVERPASS_SERVERS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
const OVERPASS_QUERY=`[out:json][timeout:25];area["ISO3166-1"="IQ"]["admin_level"="2"]->.a;relation["boundary"="administrative"]["admin_level"="4"](area.a);out body geom;`;
async function fetchOverpass(query,server,timeoutMs){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),timeoutMs);try{const res=await fetch(server,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(query),signal:ctrl.signal});clearTimeout(timer);if(!res.ok)throw new Error('HTTP '+res.status);return await res.json()}catch(err){clearTimeout(timer);throw err}}
async function fetchOverpassDynamic(query,timeoutMs=15000){for(const server of OVERPASS_SERVERS){try{const data=await fetchOverpass(query,server,timeoutMs);if(data&&Array.isArray(data.elements)&&data.elements.length)return data}catch(err){}}return null}
async function loadProvincesFromOSM(){let lastErr=null;for(let si=0;si<OVERPASS_SERVERS.length;si++){try{const data=await fetchOverpass(OVERPASS_QUERY,OVERPASS_SERVERS[si],8000);if(data&&Array.isArray(data.elements)&&data.elements.length)return data;lastErr=new Error('empty')}catch(err){lastErr=err}}throw lastErr||new Error('تعذر الاتصال')}

function bboxOf(geometry){let minX=180,minY=90,maxX=-180,maxY=-90;(function walk(c){if(typeof c[0]==='number'){if(c[0]<minX)minX=c[0];if(c[0]>maxX)maxX=c[0];if(c[1]<minY)minY=c[1];if(c[1]>maxY)maxY=c[1]}else{for(let i=0;i<c.length;i++)walk(c[i])}})(geometry.coordinates);return[minX,minY,maxX,maxY]}

function buildProvinces(geojson){
  const list=[];
  const features=(geojson&&geojson.features)||[];
  features.forEach((f,i)=>{
    if(!f.geometry)return;
    const t=f.geometry.type;
    if(t!=='Polygon'&&t!=='MultiPolygon')return;
    const tags=(f.properties&&f.properties.tags)||{};
    const rawName=tags['name:ar']||tags.name||tags['name:en']||('محافظة '+(i+1));
    const meta=lookupMeta(rawName)||lookupMeta(tags['name:en'])||lookupMeta(tags.name)||null;
    const bb=bboxOf(f.geometry);
    const bboxCenter=[(bb[0]+bb[2])/2,(bb[1]+bb[3])/2];
    let osmId=null;
    if(f.properties&&f.properties.id!=null)osmId=f.properties.id;
    else if(f.id!=null)osmId=f.id;
    list.push({
      idx:list.length,
      name:meta?meta.ar:rawName,
      nameEn:tags['name:en']||(meta?meta.en:'')||'',
      color:COLORS[list.length%COLORS.length],
      center:meta?meta.c:bboxCenter,
      bbox:bb,
      cap:meta?meta.cap:'',
      area:meta?meta.area:null,
      pop:(meta&&meta.pop)?meta.pop:0,
      note:meta?meta.note:'',
      geometry:f.geometry,
      osmId:osmId
    });
  });
  if(!list.length){
    PROVINCE_META.forEach((m,i)=>{
      list.push({idx:i,name:m.ar,nameEn:m.en,color:COLORS[i%COLORS.length],center:m.c,bbox:[m.c[0]-0.25,m.c[1]-0.25,m.c[0]+0.25,m.c[1]+0.25],cap:m.cap,area:m.area,pop:m.pop,note:m.note,geometry:null,osmId:null});
    });
  }
  return list;
}

function createNode(p){
  const el=document.createElement('div');el.className='node';
  const dot=document.createElement('span');dot.className='dot';
  dot.style.background=`radial-gradient(circle at 35% 35%, #fff, ${p.color} 45%, #ff006e)`;
  dot.style.boxShadow=`0 0 12px ${p.color}, 0 0 26px #ff006e, 0 0 40px ${p.color}88`;
  el.appendChild(dot);
  const lbl=document.createElement('span');lbl.className='node-label';lbl.textContent=p.name;
  lbl.style.borderColor=p.color;
  lbl.style.boxShadow=`0 4px 16px ${p.color}88, 0 0 16px ${p.color}44`;
  el.appendChild(lbl);
  el.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault();selectProvince(p.idx)});
  const marker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(p.center).addTo(map);
  p.marker=marker;p.labelEl=lbl;
}

function renderProvinceList(){
  const box=$('provList');if(!box)return;box.innerHTML='';
  PROVINCES.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).forEach(p=>{
    const row=document.createElement('div');row.className='provItem';row.dataset.idx=p.idx;
    const sw=document.createElement('span');sw.className='swatch';
    sw.style.background=`linear-gradient(135deg, ${p.color}, #ff006e)`;sw.style.color=p.color;
    const tx=document.createElement('span');tx.className='txt';tx.textContent=p.name;
    row.appendChild(sw);row.appendChild(tx);
    row.addEventListener('click',()=>selectProvince(p.idx));
    box.appendChild(row);
  });
  const cnt=$('provCount');if(cnt)cnt.textContent=PROVINCES.length+' محافظة';
}

function syncActiveItem(idx){
  document.querySelectorAll('.provItem').forEach(el=>{el.classList.toggle('active',Number(el.dataset.idx)===idx)});
  const active=document.querySelector('.provItem.active');
  if(active)active.scrollIntoView({block:'nearest',behavior:'smooth'});
}

const searchInput=$('search');
if(searchInput){
  searchInput.addEventListener('input',e=>{
    const q=norm(e.target.value);
    document.querySelectorAll('.provItem').forEach(el=>{
      const p=PROVINCES.find(x=>x.idx===Number(el.dataset.idx));
      if(!p)return;
      const hit=!q||norm(p.name).includes(q)||norm(p.nameEn).includes(q);
      el.style.display=hit?'flex':'none';
    });
  });
}

function deselectProvince(){
  if(selectedIdx===null)return;
  try{map.setFeatureState({source:'provinces',id:selectedIdx},{selected:false})}catch(e){}
  selectedIdx=null;syncActiveItem(-1);
}

function selectProvince(idx){
  const p=PROVINCES.find(x=>x.idx===idx);
  if(!p)return;
  if(selectedIdx!==null){try{map.setFeatureState({source:'provinces',id:selectedIdx},{selected:false})}catch(e){}}
  selectedIdx=idx;
  if(p.geometry){try{map.setFeatureState({source:'provinces',id:idx},{selected:true})}catch(e){}}
  syncActiveItem(idx);clearBranch(true);

  const pn=$('provinceName');if(pn)pn.textContent=p.name;
  const pe=$('provinceEn');if(pe)pe.textContent=p.nameEn?p.nameEn.toUpperCase():'';
  const pi=$('provinceInfo');if(pi)pi.textContent=p.note||'محافظة من محافظات العراق.';

  // القصة
  const storyBox=$('storyBox');
  if(storyBox){
    const story=PROVINCE_STORIES[p.name];
    if(story){storyBox.innerHTML='<b>📖 قصة '+p.name+'</b><br>'+story;storyBox.style.display='block'}
    else{storyBox.style.display='none'}
  }

  const grid=$('statGrid');
  if(grid){
    grid.innerHTML='';
    const stats=[
      ['المركز',p.cap||'—',''],
      ['المساحة',p.area?fmtNum(p.area):'—','كم²'],
      ['السكان',p.pop?fmtNum(p.pop):'—','نسمة'],
      ['الكثافة',(p.area&&p.pop)?fmtNum(Math.round(p.pop/p.area)):'—','ن/كم²']
    ];
    stats.forEach(([label,val,unit])=>{
      const d=document.createElement('div');d.className='stat';
      d.innerHTML='<span>'+label+'</span><b>'+val+(unit?' <em>'+unit+'</em>':'')+'</b>';
      grid.appendChild(d);
    });
  }

  const box=$('branches');
  if(box){
    box.innerHTML='';
    BRANCHES.forEach(b=>{
      const btn=document.createElement('button');
      btn.textContent=b.icon+' '+b.label;
      btn.dataset.key=b.key;
      btn.addEventListener('click',()=>runBranch(b,btn));
      box.appendChild(btn);
    });
  }

  const admin=$('adminInfo');
  if(admin){
    admin.innerHTML='';
    [
      ['الاسم العربي',p.name],
      ['الاسم الإنجليزي',p.nameEn||'—'],
      ['المركز الإداري',p.cap||'—'],
      ['معرّف OSM',p.osmId!=null?p.osmId:'غير متوفر'],
      ['المصدر',p.geometry?'OpenStreetMap':'بيانات محلية']
    ].forEach(([k,v])=>{
      const el=document.createElement('p');
      el.textContent=k+': '+v;
      admin.appendChild(el);
    });
  }

  const panel=$('panel');
  if(panel)panel.style.display='block';

  if(p.bbox){map.fitBounds([[p.bbox[0],p.bbox[1]],[p.bbox[2],p.bbox[3]]],{padding:{top:90,bottom:90,left:60,right:360},pitch:58,bearing:-6,duration:1400,maxZoom:9.5})}
  else{map.flyTo({center:p.center,zoom:8,pitch:60,duration:1200})}
}

function clearBranch(silent){
  ['branch-fill','branch-line','branch-point'].forEach(id=>{try{if(map.getLayer(id))map.removeLayer(id)}catch(e){}});
  try{if(map.getSource('branch'))map.removeSource('branch')}catch(e){}
  document.querySelectorAll('#branches button').forEach(b=>b.classList.remove('active'));
  if(!silent)toast('✨ تم مسح الفروع');
}

async function runBranch(branch,btn){
  if(selectedIdx===null)return;
  const p=PROVINCES.find(x=>x.idx===selectedIdx);
  if(!p)return;
  if(p.osmId===null||p.osmId===undefined){toast('⚠️ لا تتوفر بيانات OSM');return}
  if(btn.classList.contains('active')){clearBranch();return}
  clearBranch(true);
  btn.classList.add('active');
  toast('⏳ جاري جلب '+branch.label+'...',8000);
  const areaId=3600000000+Number(p.osmId);
  const query='[out:json][timeout:45];\n'+'area('+areaId+')->.a;\n'+branch.q+'(area.a);\n'+'out geom 900;';
  const data=await fetchOverpassDynamic(query,30000);
  if(!data||!data.elements||!data.elements.length){btn.classList.remove('active');toast('❌ لم يتم العثور على بيانات');return}
  try{
    await ensureOSMToGeoJSON();
    let gj=window.osmtogeojson(data,{flatProperties:true});
    if(gj&&typeof gj.then==='function')gj=await gj;
    const feats=(gj.features||[]).filter(f=>f.geometry);
    if(!feats.length)throw new Error('empty');
    map.addSource('branch',{type:'geojson',data:{type:'FeatureCollection',features:feats}});
    const beforeId=map.getLayer('province-3d')?'province-3d':undefined;
    map.addLayer({id:'branch-fill',type:'fill',source:'branch',paint:{'fill-color':['case',['==',['geometry-type'],'Polygon'],'#FF006E','#00F5FF'],'fill-opacity':0.22,'fill-outline-color':'#FFE600'}},beforeId);
    map.addLayer({id:'branch-line',type:'line',source:'branch',paint:{'line-color':['case',['==',['geometry-type'],'LineString'],'#00F5FF','#FFE600'],'line-width':2.5,'line-opacity':0.95,'line-blur':0.5}},beforeId);
    map.addLayer({id:'branch-point',type:'circle',source:'branch',paint:{'circle-radius':5.5,'circle-color':['case',['==',['geometry-type'],'Point'],'#FFE600','#FF006E'],'circle-stroke-width':1.8,'circle-stroke-color':'#ffffff','circle-opacity':0.98}},beforeId);
    toast('✨ '+branch.label+': '+feats.length+' عنصر');
  }catch(err){btn.classList.remove('active');toast('❌ تعذر عرض البيانات')}
}

async function loadBuildingsForViewport(silent){
  if(!map||!mapLoaded)return false;
  if(map.getZoom()<15){if(!silent)toast('⚠️ قرّب الخريطة أكثر (zoom ≥ 15)');return false}
  const b=map.getBounds();
  const bbox=`${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
  const query=`[out:json][timeout:20];(way["building"](${bbox});relation["building"](${bbox}););out geom 800;`;
  if(!silent)toast('🏗️ جاري تحميل المباني...',8000);
  const data=await fetchOverpassDynamic(query,15000);
  if(!data||!data.elements?.length){if(!silent)toast('❌ لا توجد مباني');return false}
  try{
    await ensureOSMToGeoJSON();
    let gj=window.osmtogeojson(data,{flatProperties:false});
    if(gj&&typeof gj.then==='function')gj=await gj;
    const feats=(gj.features||[]).filter(f=>f.geometry);
    if(!feats.length)return false;
    feats.forEach(f=>{
      const tags=(f.properties&&f.properties.tags)||f.properties||{};
      const rawH=parseFloat(tags.height);
      const rawL=parseFloat(tags['building:levels']);
      let h=6;
      if(Number.isFinite(rawH))h=rawH;
      else if(Number.isFinite(rawL))h=rawL*3.2;
      f.properties=f.properties||{};
      f.properties._h=Math.max(3,h);
      const type=String(tags.building||'yes').toLowerCase();
      if(/residential|house|apartments|dormitory/.test(type))f.properties._color='#B8B8C8';
      else if(/commercial|retail|office|industrial/.test(type))f.properties._color='#FFE0A0';
      else if(/school|university|hospital|government|mosque|church/.test(type))f.properties._color='#A0D8FF';
      else f.properties._color='#C0C0C0';
    });
    if(map.getSource('real-buildings')){
      map.getSource('real-buildings').setData({type:'FeatureCollection',features:feats});
    }else{
      map.addSource('real-buildings',{type:'geojson',data:{type:'FeatureCollection',features:feats}});
      const beforeId=getBeforeSymbolId();
      addLayerSafe({
        id:'real-buildings-3d',type:'fill-extrusion',source:'real-buildings',
        paint:{'fill-extrusion-color':['get','_color'],'fill-extrusion-height':['get','_h'],'fill-extrusion-base':0,'fill-extrusion-opacity':0.92,'fill-extrusion-vertical-gradient':true}
      },beforeId);
    }
    if(!silent)toast(`🏗️ تم تحميل ${feats.length} مبنى`);
    return true;
  }catch(e){console.warn(e);return false}
}

function clearBuildings(){
  try{if(map.getLayer('real-buildings-3d'))map.removeLayer('real-buildings-3d')}catch(e){}
  try{if(map.getSource('real-buildings'))map.removeSource('real-buildings')}catch(e){}
}

const ROAD_TYPE_COLOR=['match',['get','highway'],'motorway','#FF006E','motorway_link','#FF006E','trunk','#FB5607','trunk_link','#FB5607','primary','#FFE600','primary_link','#FFE600','secondary','#00F5FF','secondary_link','#00F5FF','tertiary','#06FFA5','tertiary_link','#06FFA5','residential','#B537F2','living_street','#9B5DE5','service','#8A8AA0','footway','#8B8B8B','path','#8B8B8B','pedestrian','#FF9F1C','steps','#8B8B8B','cycleway','#8B8B8B','#B537F2'];
const ROAD_TYPE_WIDTH=['match',['get','highway'],'motorway',5,'motorway_link',3,'trunk',4,'trunk_link',3,'primary',3.5,'primary_link',2.5,'secondary',3,'secondary_link',2,'tertiary',2.5,'tertiary_link',1.8,'residential',2,'living_street',1.8,'service',1.5,'footway',1.2,'path',1.2,'pedestrian',1.5,'steps',1,'cycleway',1.2,1.5];

async function loadRoadsForViewport(silent){
  if(!map||!mapLoaded)return false;
  if(map.getZoom()<13){if(!silent)toast('⚠️ قرّب الخريطة أكثر (zoom ≥ 13)');return false}
  const b=map.getBounds();
  const bbox=`${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
  const query=`[out:json][timeout:25];(way["highway"~"motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|residential|living_street|service|footway|pedestrian|path|steps|cycleway"](${bbox});way["bridge"="yes"](${bbox});way["tunnel"="yes"](${bbox}););out geom 2000;`;
  if(!silent)toast('🛣️ جاري تحميل الطرق...',8000);
  const data=await fetchOverpassDynamic(query,15000);
  if(!data||!data.elements?.length){if(!silent)toast('❌ لا توجد طرق');return false}
  try{
    await ensureOSMToGeoJSON();
    let gj=window.osmtogeojson(data,{flatProperties:true});
    if(gj&&typeof gj.then==='function')gj=await gj;
    const feats=(gj.features||[]).filter(f=>f.geometry&&(f.geometry.type==='LineString'||f.geometry.type==='MultiLineString'));
    if(!feats.length)return false;
    feats.forEach(f=>{
      const tags=f.properties||{};
      if(tags.maxspeed){const m=String(tags.maxspeed).match(/(\d+)/);f.properties._speed=m?parseInt(m[1],10):null}
      else{f.properties._speed=null}
    });
    if(map.getSource('real-roads')){
      map.getSource('real-roads').setData({type:'FeatureCollection',features:feats});
    }else{
      map.addSource('real-roads',{type:'geojson',data:{type:'FeatureCollection',features:feats}});
      const beforeId=getBeforeSymbolId();
      addLayerSafe({id:'real-tunnels',type:'line',source:'real-roads',filter:['==',['get','tunnel'],'yes'],paint:{'line-color':'#00F5FF','line-width':2,'line-dasharray':[2,2],'line-opacity':0.85}},beforeId);
      addLayerSafe({id:'real-roads-line',type:'line',source:'real-roads',paint:{'line-color':ROAD_TYPE_COLOR,'line-width':ROAD_TYPE_WIDTH,'line-opacity':0.95}},beforeId);
      addLayerSafe({id:'real-bridges',type:'line',source:'real-roads',filter:['==',['get','bridge'],'yes'],paint:{'line-color':'#FFE600','line-width':3.5,'line-opacity':0.95}},beforeId);
    }
    if(!silent)toast(`🛣️ تم تحميل ${feats.length} مقطع طرق`);
    return true;
  }catch(e){console.warn(e);return false}
}

function clearRoads(){
  ['real-roads-line','real-bridges','real-tunnels'].forEach(id=>{try{if(map.getLayer(id))map.removeLayer(id)}catch(e){}});
  try{if(map.getSource('real-roads'))map.removeSource('real-roads')}catch(e){}
}

function ensureAircraftIcon(){
  if(!map||map.hasImage('aircraft-icon'))return;
  try{
    const c=document.createElement('canvas');c.width=32;c.height=32;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#00F5FF';ctx.strokeStyle='#FFFFFF';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(16,2);ctx.lineTo(20,12);ctx.lineTo(30,14);ctx.lineTo(30,18);ctx.lineTo(20,16);ctx.lineTo(20,26);ctx.lineTo(24,30);ctx.lineTo(12,30);ctx.lineTo(12,26);ctx.lineTo(12,16);ctx.lineTo(2,18);ctx.lineTo(2,14);ctx.lineTo(12,12);ctx.closePath();
    ctx.fill();ctx.stroke();
    const imgData=ctx.getImageData(0,0,32,32);
    map.addImage('aircraft-icon',imgData);
  }catch(e){console.warn('icon error',e)}
}

async function fetchLiveAircraft(){
  if(!map||!mapLoaded||aircraftAborted)return;
  const b=map.getBounds();
  const url=`https://opensky-network.org/api/states/all?lamin=${b.getSouth()}&lomin=${b.getWest()}&lamax=${b.getNorth()}&lomax=${b.getEast()}`;
  try{
    const res=await fetch(url);
    if(!res.ok)return;
    const json=await res.json();
    if(aircraftAborted)return;
    const features=(json.states||[]).map(s=>({
      type:'Feature',
      geometry:{type:'Point',coordinates:[s[5],s[6]]},
      properties:{
        callsign:(s[1]||'').trim()||'—',
        altitude:(s[7]!==null&&s[7]!==undefined)?s[7]:((s[13]!==null&&s[13]!==undefined)?s[13]:0),
        velocity:(s[9]!==null&&s[9]!==undefined)?s[9]:0,
        heading:(s[10]!==null&&s[10]!==undefined)?s[10]:0,
        country:s[2]||''
      }
    })).filter(f=>f.geometry.coordinates[0]!=null&&f.geometry.coordinates[1]!=null);
    if(map.getSource('live-aircraft')){
      map.getSource('live-aircraft').setData({type:'FeatureCollection',features});
    }else{
      map.addSource('live-aircraft',{type:'geojson',data:{type:'FeatureCollection',features}});
      const beforeId=getBeforeSymbolId();
      map.addLayer({id:'live-aircraft-icons',type:'symbol',source:'live-aircraft',layout:{'icon-image':'aircraft-icon','icon-size':0.85,'icon-rotate':['coalesce',['get','heading'],0],'icon-allow-overlap':true,'icon-ignore-placement':true}},beforeId);
      map.addLayer({id:'live-aircraft-labels',type:'symbol',source:'live-aircraft',layout:{'text-field':['get','callsign'],'text-font':['Noto Sans Regular'],'text-size':9,'text-offset':[0,1.4],'text-anchor':'top'},paint:{'text-color':'#FFFFFF','text-halo-color':'#0a0320','text-halo-width':1}});
    }
  }catch(e){}
}

function startAircraftTracking(){
  if(aircraftTimer)return;
  aircraftAborted=false;
  ensureAircraftIcon();
  fetchLiveAircraft();
  aircraftTimer=setInterval(fetchLiveAircraft,15000);
}

function stopAircraftTracking(){
  aircraftAborted=true;
  clearInterval(aircraftTimer);
  aircraftTimer=null;
  try{if(map.getLayer('live-aircraft-icons'))map.removeLayer('live-aircraft-icons')}catch(e){}
  try{if(map.getLayer('live-aircraft-labels'))map.removeLayer('live-aircraft-labels')}catch(e){}
  try{if(map.getSource('live-aircraft'))map.removeSource('live-aircraft')}catch(e){}
}

function toggleTrafficMode(){
  if(!map.getLayer('real-roads-line')){toast('⚠️ حمّل الطرق أولاً (🛣️)');return}
  trafficMode=!trafficMode;
  if(trafficMode){
    map.setPaintProperty('real-roads-line','line-color',['case',['>=',['coalesce',['get','_speed'],0],80],'#06FFA5',['>=',['coalesce',['get','_speed'],0],50],'#FFE600',['>',['coalesce',['get','_speed'],0],0],'#FF006E','#5A5A78']);
    map.setPaintProperty('real-roads-line','line-width',4);
    toast('🚦 السرعات القصوى: أخضر ≥80، أصفر 50-79، أحمر <50');
  }else{
    map.setPaintProperty('real-roads-line','line-color',ROAD_TYPE_COLOR);
    map.setPaintProperty('real-roads-line','line-width',ROAD_TYPE_WIDTH);
    toast('🛣️ ألوان الطرق حسب النوع');
  }
  $('toggleTraffic').classList.toggle('on',trafficMode);
}

function clearRoute(){
  routeSources.forEach(id=>{
    try{if(map.getLayer(id+'-line'))map.removeLayer(id+'-line')}catch(e){}
    try{if(map.getSource(id))map.removeSource(id)}catch(e){}
  });
  routeSources=[];
  if(destinationMarker){try{destinationMarker.remove()}catch(e){}destinationMarker=null}
}

async function routeToDestination(destLng,destLat){
  if(!userLocation){toast('⚠️ اضغط 📍 موقعي أولاً');return}
  const[uLng,uLat]=userLocation;
  const url=`https://router.project-osrm.org/route/v1/driving/${uLng},${uLat};${destLng},${destLat}?overview=full&geometries=geojson&alternatives=true&steps=false`;
  toast('🧭 جاري حساب المسار...',6000);
  try{
    const res=await fetch(url);
    if(!res.ok)throw new Error('OSRM '+res.status);
    const json=await res.json();
    if(!json.routes||!json.routes.length){toast('❌ تعذر حساب المسار');return}
    clearRoute();
    const main=json.routes[0];
    map.addSource('route-main',{type:'geojson',data:{type:'Feature',geometry:main.geometry,properties:{}}});
    map.addLayer({id:'route-main-line',type:'line',source:'route-main',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#00F5FF','line-width':7,'line-opacity':0.95,'line-blur':1}});
    routeSources.push('route-main');
    json.routes.slice(1).forEach((r,i)=>{
      const id=`route-alt-${i}`;
      map.addSource(id,{type:'geojson',data:{type:'Feature',geometry:r.geometry,properties:{}}});
      map.addLayer({id:`${id}-line`,type:'line',source:id,layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#FFE600','line-width':4,'line-opacity':0.65,'line-dasharray':[2,2]}});
      routeSources.push(id);
    });
    const el=document.createElement('div');
    el.style.cssText='width:20px;height:20px;background:#FF006E;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 24px #FF006E;';
    destinationMarker=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([destLng,destLat]).addTo(map);
    const km=(main.distance/1000).toFixed(1);
    const min=Math.round(main.duration/60);
    const altCount=json.routes.length-1;
    toast(`✨ الأسرع: ${km} كم — ${min} دقيقة${altCount>0?' ('+altCount+' بديل)':''}`,5000);
    const coords=main.geometry.coordinates;
    let minX=180,minY=90,maxX=-180,maxY=-90;
    for(const[x,y]of coords){
      if(x<minX)minX=x;if(x>maxX)maxX=x;
      if(y<minY)minY=y;if(y>maxY)maxY=y;
    }
    map.fitBounds([[minX,minY],[maxX,maxY]],{padding:{top:100,bottom:100,left:80,right:80},pitch:55,duration:1400});
  }catch(e){console.warn(e);toast('❌ تعذر الاتصال بخدمة OSRM')}
}

/* ============================================================
   15. تحديث الارتفاع حسب الزوم
   ============================================================ */
function updateProvinceExtrusionForZoom(){
  if(!map||!map.getLayer('province-3d'))return;
  if(popRiseActive)return;
  const z=map.getZoom();
  const bucket=Math.floor(z);
  if(bucket===lastBldZoomBucket)return;
  lastBldZoomBucket=bucket;
  let h=1700,op=0.78;
  if(buildingsActive&&z>11){
    const t=Math.min(1,(z-11)/4);
    h=1700*Math.max(0.01,1-t*0.99);
    op=0.78*Math.max(0.15,1-t*0.85);
  }
  try{
    map.setPaintProperty('province-3d','fill-extrusion-height',[
      'case',
      ['boolean',['feature-state','selected'],false],h*2,
      ['boolean',['feature-state','hover'],false],h*1.5,
      h
    ]);
    map.setPaintProperty('province-3d','fill-extrusion-opacity',op);
  }catch(e){}
}

$('myLocation').addEventListener('click',function(){
  if(!navigator.geolocation){toast('⚠️ متصفحك لا يدعم تحديد الموقع');return}
  this.classList.add('on');toast('📡 جاري تحديد موقعك...',3000);
  navigator.geolocation.getCurrentPosition(
    (position)=>{
      const lng=position.coords.longitude;
      const lat=position.coords.latitude;
      const accuracy=position.coords.accuracy;
      userLocation=[lng,lat];
      map.flyTo({center:[lng,lat],zoom:15,pitch:60,bearing:0,duration:1800});
      if(userMarker)userMarker.remove();
      if(map.getLayer('user-accuracy'))map.removeLayer('user-accuracy');
      if(map.getSource('user-accuracy'))map.removeSource('user-accuracy');
      const el=document.createElement('div');
      el.className='user-marker';
      el.innerHTML='<div class="user-pulse"></div><div class="user-dot"></div>';
      userMarker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lng,lat]).addTo(map);
      const points=64;const coords=[];
      const distanceX=accuracy/(111320*Math.cos(lat*Math.PI/180));
      const distanceY=accuracy/110574;
      for(let i=0;i<points;i++){
        const theta=(i/points)*(2*Math.PI);
        coords.push([lng+distanceX*Math.cos(theta),lat+distanceY*Math.sin(theta)]);
      }
      coords.push(coords[0]);
      map.addSource('user-accuracy',{type:'geojson',data:{type:'Feature',geometry:{type:'Polygon',coordinates:[coords]}}});
      map.addLayer({id:'user-accuracy',type:'fill',source:'user-accuracy',paint:{'fill-color':'#00f5ff','fill-opacity':0.15,'fill-outline-color':'#00f5ff'}});
      toast('✨ تم تحديد موقعك بنجاح');
      setTimeout(()=>$('myLocation').classList.remove('on'),3000);
    },
    (error)=>{
      $('myLocation').classList.remove('on');
      if(error.code===1)toast('❌ تم رفض إذن الوصول للموقع');
      else if(error.code===2)toast('❌ الموقع غير متاح');
      else if(error.code===3)toast('❌ استغرق وقتاً طويلاً');
      else toast('❌ تعذر تحديد الموقع');
    },
    {enableHighAccuracy:true,timeout:10000,maximumAge:0}
  );
});

/* ============================================================
   18. تهيئة الخريطة
   ============================================================ */
function setupMapBase(){
  try{
    map.addSource('iraq-dem',{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,encoding:'terrarium',maxzoom:14});
    map.setTerrain({source:'iraq-dem',exaggeration:1.35});
  }catch(err){}
  try{if(map.setLight){map.setLight({anchor:'viewport',color:'#ffffff',intensity:0.95,position:[1.5,220,50]})}}catch(err){}
  try{map.addLayer({id:'iraq-hillshade',type:'hillshade',source:'iraq-dem',paint:{'hillshade-exaggeration':0.8,'hillshade-shadow-color':'#1a0033','hillshade-highlight-color':'#ff2ec4','hillshade-accent-color':'#00f5ff'}})}catch(err){}
  try{map.setFog({range:[-0.6,2.2],color:'#0a0425','horizon-blend':0.25,'high-color':'#1a0045','space-color':'#02010a','star-intensity':0.65})}catch(err){}
  try{map.addLayer({id:'sky',type:'sky',paint:{'sky-type':'atmosphere','sky-atmosphere-sun':[0,45],'sky-atmosphere-sun-intensity':10}})}catch(err){}
}

async function loadOSMInBackground(){
  if(osmLoaded)return;
  try{
    const osm=await withTimeout(loadProvincesFromOSM(),28000);
    if(!osm)throw new Error('no data');
    await ensureOSMToGeoJSON();
    let geojson=window.osmtogeojson(osm,{flatProperties:false});
    if(geojson&&typeof geojson.then==='function')geojson=await geojson;
    if(!geojson||!geojson.features||!geojson.features.length)throw new Error('empty');
    const newList=buildProvinces(geojson);
    if(!newList.length||!newList.some(x=>x.geometry))throw new Error('no geometry');
    clearMapData();
    PROVINCES=newList;
    addProvinceLayers();
    lastBldZoomBucket=-1;
    updateProvinceExtrusionForZoom();
    osmLoaded=true;
    setStatus('تم تحميل <b>'+PROVINCES.length+'</b> محافظة');
    toast('✨ تم تحديث الحدود من OpenStreetMap');
  }catch(err){
    if(!osmLoaded)setStatus('وضع محلي — '+PROVINCES.length+' محافظة');
  }
}

let mapReady=false;
let mapHandlersRegistered2=false;

function onMapReady(){
  if(mapReady)return;
  mapReady=true;
  try{progress(30,'جاري إعداد التضاريس...')}catch(e){}
  try{setupMapBase()}catch(e){console.warn('setupMapBase:',e)}
  try{progress(45,'جاري تلوين الخريطة...')}catch(e){}
  try{applyFullVividTheme()}catch(e){console.warn('theme:',e)}
  try{progress(60,'جاري رسم المحافظات...')}catch(e){}
  try{PROVINCES=buildProvinces(null);addProvinceLayers()}catch(e){console.warn('provinces:',e)}

  if(!mapHandlersRegistered2){
    try{
      map.on('click',(e)=>{
        if(!destPicking)return;
        destPicking=false;
        map.getCanvas().style.cursor='';
        $('pickDest').classList.remove('on');
        routeToDestination(e.lngLat.lng,e.lngLat.lat);
      });
      map.on('moveend',()=>{
        clearTimeout(map._bldTimer);
        if(buildingsActive)map._bldTimer=setTimeout(()=>loadBuildingsForViewport(true),1400);
        clearTimeout(map._rdTimer);
        if(roadsActive)map._rdTimer=setTimeout(()=>loadRoadsForViewport(true),1700);
      });
      map.on('zoom',updateProvinceExtrusionForZoom);
      mapHandlersRegistered2=true;
    }catch(e){console.warn('handlers:',e)}
  }
  try{progress(100,'جاهز!')}catch(e){}
  try{setStatus('وضع محلي — جاري تحديث الحدود...')}catch(e){}
  hideLoading();
  setTimeout(()=>{try{loadOSMInBackground()}catch(e){}},300);
  setTimeout(()=>{try{map.easeTo({center:[43.8,33.2],zoom:5.2,pitch:52,bearing:-8,duration:1400})}catch(e){}},200);
  setTimeout(()=>{try{applyFullVividTheme()}catch(e){}},3000);
}

async function initMap(){
  try{
    maplibregl.setRTLTextPlugin(
      'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/mapbox-gl-rtl-text.js',
      null,
      true
    );
  }catch(e){}

  let style=null;
  try{
    const res=await fetchWithTimeout('https://tiles.openfreemap.org/styles/liberty',12000);
    if(!res.ok)throw new Error('HTTP '+res.status);
    style=await res.json();
    style.glyphs='https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf';
    style.layers.forEach(layer=>{
      if(layer.type==='symbol'){
        if(!layer.layout)layer.layout={};
        layer.layout['text-font']=['Noto Sans Regular'];
        if(layer.layout['text-field']){
          const fieldStr=JSON.stringify(layer.layout['text-field']);
          if(fieldStr.includes('"name"')&&!fieldStr.includes('"name:ar"')){
            layer.layout['text-field']=['coalesce',['get','name:ar'],['get','name']];
          }
        }
      }
    });
  }catch(err){
    console.warn('[IRAQ] Liberty failed, fallback:',err);
    style=createFallbackStyle();
    try{toast('⚠️ تم استخدام الستايل الاحتياطي',4000)}catch(e){}
  }

  try{
    map=new maplibregl.Map({
      container:'map',style:style,center:[43.8,33.2],zoom:5.2,pitch:52,bearing:-8,
      maxPitch:85,minZoom:3.5,maxZoom:18,antialias:true,attributionControl:false
    });
  }catch(err){
    const el=$('loadText');
    if(el){el.innerHTML='⚠️ تعذر تهيئة الخريطة (WebGL غير مدعوم؟)<br><button class="retryBtn" onclick="location.reload()">إعادة المحاولة</button>'}
    hideLoading();return;
  }

  map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');
  map.addControl(new maplibregl.ScaleControl({unit:'metric',maxWidth:120}),'bottom-right');

  map.on('error',e=>{if(e&&e.error&&/tile|404|Failed to fetch/i.test(e.error.message||''))return});
  map.on('style.load',()=>{try{applyFullVividTheme()}catch(e){};setTimeout(hideLoading,800)});
  map.on('load',()=>{mapLoaded=true;onMapReady()});

  setTimeout(()=>{
    if(!mapReady){
      if(map&&map.isStyleLoaded()){try{onMapReady()}catch(e){hideLoading()}}
      else{hideLoading()}
    }
  },15000);

  setTimeout(()=>{
    if(!mapReady){
      const el=$('loadText');
      if(el&&!loadingHidden){el.innerHTML='⚠️ تأخر تحميل الخريطة.<br><button class="retryBtn" onclick="location.reload()">إعادة المحاولة</button>'}
      hideLoading();
    }
  },25000);
}

initMap();
window.addEventListener('load',()=>{if(window.innerWidth<720){setTimeout(()=>{const el=$('sideList');if(el)el.classList.add('hidden')},3500)}});
</script>
